<style>
  :root{
    --orange:#FF9210; --orange-dark:#C05F00; --orange-soft:#FFF4E4; --orange-border:#FFDFB2;
    --brand-green:#15A278;
    --ink:#1F2430; --ink-soft:#5A6272; --ink-faint:#8A91A0;
    --bg:#F7F5F2; --card:#FFFFFF; --line:#E8E4DE;
    --green:#0E7D5C; --green-soft:#E4F5EF;
    --amber:#8A6100; --amber-soft:#FBF0D2;
    --blue:#215DB0; --blue-soft:#E9F0FB;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;}

  .accent-bar{height:5px; background:linear-gradient(90deg,var(--orange) 0%,var(--orange) 55%,var(--brand-green) 100%);}
  header{background:#fff; border-bottom:1px solid var(--line); color:var(--ink); padding:22px 24px 18px;}
  .header-inner{max-width:1180px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px;}
  .brand img.logo{height:42px; display:block; margin-bottom:10px;}
  .brand h1{font-size:24px; font-weight:700; letter-spacing:.2px; color:var(--ink);}
  .brand .loc{margin-top:5px; font-size:14px; color:var(--ink-soft);}
  .brand .loc b{color:var(--orange-dark);}
  .stats{display:flex; gap:12px; flex-wrap:wrap;}
  .stat{background:var(--orange-soft); border:1px solid var(--orange-border); border-radius:10px; padding:8px 18px; text-align:center; min-width:104px;}
  .stat .n{font-size:20px; font-weight:700; color:var(--orange-dark);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft);}

  .toolbar{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgba(31,36,48,.05); padding:12px 24px;}
  .toolbar-inner{max-width:1180px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .search-wrap{flex:1 1 260px; position:relative;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--ink-faint);}
  input[type="search"]{width:100%; padding:9px 12px 9px 36px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#FCFBFA; color:var(--ink);}
  input[type="search"]:focus{outline:2px solid var(--orange); outline-offset:-1px; border-color:var(--orange);}
  select{padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:#FCFBFA; color:var(--ink); max-width:190px;}
  select:focus{outline:2px solid var(--orange); outline-offset:-1px;}
  .btn{padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:#FCFBFA; font-size:13.5px; cursor:pointer; color:var(--ink-soft); white-space:nowrap;}
  .btn:hover{border-color:var(--orange); color:var(--orange-dark);}

  main{max-width:1180px; margin:0 auto; padding:18px 24px 60px;}
  .result-meta{font-size:13px; color:var(--ink-soft); margin:4px 2px 14px;}
  .result-meta b{color:var(--ink);}

  .test{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; transition:border-color .15s, box-shadow .15s;}
  .test:hover{border-color:#D8D2C9; box-shadow:0 2px 10px rgba(31,36,48,.06);}
  .test.open{border-color:var(--orange-border); box-shadow:0 3px 14px rgba(234,91,12,.09);}
  .test-head{display:grid; grid-template-columns:1fr auto auto; grid-template-rows:auto auto; gap:6px 18px; padding:14px 18px; cursor:pointer; user-select:none; align-items:center;}
  .test-title{grid-column:1; grid-row:1;}
  .meta-row{grid-column:1; grid-row:2;}
  .price-tat{grid-column:2;}
  .head-right{grid-column:3;}
  .test-title{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .test-title h2{font-size:16px; font-weight:650; color:var(--ink);}
  .tid{font-size:11.5px; color:var(--ink-faint); font-weight:500; white-space:nowrap;}
  .badges{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:2.5px 8px; border-radius:999px; letter-spacing:.2px; white-space:nowrap;}
  .b-nabl{background:var(--green-soft); color:var(--green);}
  .b-fast{background:var(--blue-soft); color:var(--blue);}
  .b-lab{background:#F1EFEA; color:var(--ink-soft);}
  .b-lab.ohl{background:var(--orange-soft); color:var(--orange-dark);}
  .price-tat{display:flex; flex-direction:column; align-items:flex-end; gap:2px; justify-content:center; grid-row:1 / 3;}
  .price{font-size:18px; font-weight:700; color:var(--orange-dark); white-space:nowrap;}
  .tat{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  .meta-row{grid-column:1; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; font-size:12.5px; color:var(--ink-soft);}
  .meta-item{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
  .meta-item svg{width:13px; height:13px; stroke:var(--ink-faint); flex:none;}
  .days{display:inline-flex; gap:2.5px;}
  .day{width:17px; height:17px; border-radius:4px; font-size:9.5px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; background:#EFECE7; color:#B6B0A6;}
  .day.on{background:var(--orange-soft); color:var(--orange-dark); border:1px solid var(--orange-border);}
  .ondemand{font-size:11px; font-weight:600; color:var(--amber); background:var(--amber-soft); padding:2px 8px; border-radius:999px;}
  .chev{width:16px; height:16px; stroke:var(--ink-faint); transition:transform .18s; margin-left:8px; flex:none;}
  .open .chev{transform:rotate(180deg);}
  .head-right{display:flex; align-items:center; grid-row:1 / 3;}

  .test-body{display:none; border-top:1px dashed var(--line); background:#FDFCFB; padding:14px 18px 16px;}
  .open .test-body{display:block;}
  .inv-count{font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-faint); margin-bottom:8px;}
  table.inv{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.inv th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); font-weight:600; padding:6px 10px; border-bottom:1px solid var(--line);}
  table.inv td{padding:7px 10px; border-bottom:1px solid #F0EDE8; vertical-align:top;}
  table.inv tr:last-child td{border-bottom:none;}
  td.inv-name{font-weight:550; width:32%; min-width:160px;}
  td.inv-method{color:var(--ink-soft); font-size:12.8px;}
  .dash{color:var(--ink-faint); font-size:12px;}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty b{color:var(--ink);}
  .error-box{max-width:720px; margin:40px auto; background:#FDECEC; border:1px solid #F5C6C6; color:#8A1F1F; padding:18px 22px; border-radius:10px; font-size:14px;}
  .error-box code{background:#fff; padding:1px 6px; border-radius:4px;}

  footer{border-top:1px solid var(--line); padding:18px 24px 30px; font-size:12px; color:var(--ink-faint); text-align:center;}
  .approvals{margin-top:10px; font-size:13px; color:var(--ink-soft); display:flex; gap:28px; justify-content:center; flex-wrap:wrap;}
  .approvals b{color:var(--ink);}
  .print-footer{display:none;}

  @media (max-width:680px){
    .test-head{grid-template-columns:1fr auto;}
    .test-title{grid-column:1 / 3;}
    .meta-row{grid-column:1 / 3; grid-row:2;}
    .price-tat{grid-column:1; grid-row:3; flex-direction:row; align-items:center; gap:12px; justify-content:flex-start;}
    .head-right{grid-column:2; grid-row:3;}
    select{max-width:none; flex:1 1 45%;}
  }
  @media print{
    .toolbar{display:none;}
    .test{break-inside:avoid;}
    .test-body{display:block;}
    body{background:#fff; margin-bottom:0;}
    main{padding-bottom:70px;}
    footer{padding-bottom:70px;}
    .print-footer{display:flex; position:fixed; bottom:0; left:0; right:0; justify-content:space-between; align-items:center; gap:20px; background:#fff; border-top:1.5px solid var(--orange); padding:6px 18px 4px; font-size:11px; color:#333;}
    .print-footer img{height:16px;}
    .print-footer b{color:#000;}
  }
  @page{margin:14mm 10mm 22mm;}
</style>
</head>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DAYS = ["M","T","W","T","F","S","S"];
  const inr = new Intl.NumberFormat("en-IN");

  let DATA = null, TESTS = [], expanded = new Set(), allExpanded = false;

  // A test is NABL accredited if any of its investigations is NABL accredited.
  function nablStatus(t){
    return t.investigations.some(i => i.nabl) ? "nabl" : "none";
  }
  function tatLabel(h){
    if (h == null) return "TAT —";
    if (h < 24) return "TAT " + h + " hr" + (h === 1 ? "" : "s");
    const d = Math.round(h / 24 * 10) / 10;
    return "TAT " + h + " hrs (~" + d + " day" + (d === 1 ? "" : "s") + ")";
  }
  function freqHTML(f){
    if (!f || !/^[01]{7}$/.test(f)) return '<span class="ondemand">On demand</span>';
    if (f === "0000000") return '<span class="ondemand">On demand</span>';
    return '<span class="days">' + [...f].map((b,i) =>
      '<span class="day' + (b === "1" ? " on" : "") + '">' + DAYS[i] + "</span>").join("") + "</span>";
  }
  const icon = {
    vial: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 3h6M10 3v6l-4.5 8A3.5 3.5 0 0 0 8.6 22h6.8a3.5 3.5 0 0 0 3.1-5L14 9V3"/></svg>',
    box:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M4 11h16M9 7V4h6v3"/></svg>',
    cal:  '<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>'
  };

  function testHTML(t, idx){
    const st = nablStatus(t);
    const isOHL = /^OHL/i.test(t.lab);
    const open = allExpanded || expanded.has(t.id + "|" + t.name);
    const badges = [];
    if (st === "nabl") badges.push('<span class="badge b-nabl">✓ NABL</span>');
    if (t.fasting) badges.push('<span class="badge b-fast">Fasting required</span>');
    badges.push('<span class="badge b-lab' + (isOHL ? " ohl" : "") + '">' + esc(t.lab) + "</span>");

    const invRows = t.investigations.map(i =>
      "<tr><td class='inv-name'>" + esc(i.name) + "</td>" +
      "<td class='inv-method'>" + (i.method ? esc(i.method) : "<span class='dash'>—</span>") + "</td></tr>"
    ).join("");

    return '<article class="test' + (open ? " open" : "") + '" data-idx="' + idx + '">' +
      '<div class="test-head" role="button" aria-expanded="' + open + '">' +
        '<div class="test-title"><h2>' + esc(t.name) + '</h2><span class="tid">ID ' + esc(t.id) + '</span><span class="badges">' + badges.join("") + '</span></div>' +
        '<div class="price-tat"><span class="price">₹' + (t.price != null ? inr.format(t.price) : "—") + '</span><span class="tat">' + esc(tatLabel(t.tat_hours)) + '</span></div>' +
        '<div class="meta-row">' +
          (t.sample ? '<span class="meta-item">' + icon.vial + esc(t.sample) + "</span>" : "") +
          (t.container ? '<span class="meta-item">' + icon.box + esc(t.container) + "</span>" : "") +
          '<span class="meta-item">' + icon.cal + freqHTML(t.freq) + "</span>" +
          '<span class="meta-item">' + t.investigations.length + " parameter" + (t.investigations.length === 1 ? "" : "s") + "</span>" +
        "</div>" +
        '<div class="head-right"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></div>' +
      "</div>" +
      '<div class="test-body"><div class="inv-count">Included parameters (' + t.investigations.length + ")</div>" +
        '<table class="inv"><thead><tr><th>Parameter</th><th>Method</th></tr></thead><tbody>' + invRows + "</tbody></table>" +
      "</div></article>";
  }

  function apply(){
    const q = $("q").value.trim().toLowerCase();
    const fs = $("f-sample").value, fl = $("f-lab").value, ff = $("f-fast").value, fn = $("f-nabl").value;
    let list = TESTS.filter(t => {
      if (fs && t.sample !== fs) return false;
      if (fl && t.lab !== fl) return false;
      if (ff && (ff === "yes") !== t.fasting) return false;
      if (fn && nablStatus(t) !== fn) return false;
      if (q){
        const hay = (t.name + " " + t.id + " " + t.sample + " " + t.investigations.map(i => i.name).join(" ")).toLowerCase();
        if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
      }
      return true;
    });
    const s = $("sort").value;
    list.sort((a,b) =>
      s === "price-asc"  ? (a.price ?? 1e12) - (b.price ?? 1e12) :
      s === "price-desc" ? (b.price ?? -1) - (a.price ?? -1) :
      s === "tat"        ? (a.tat_hours ?? 1e12) - (b.tat_hours ?? 1e12) :
      a.name.localeCompare(b.name));

    $("meta").innerHTML = "Showing <b>" + list.length + "</b> of <b>" + TESTS.length + "</b> tests" +
      (q || fs || fl || ff || fn ? " (filtered)" : "");
    $("list").innerHTML = list.length
      ? list.map(t => testHTML(t, TESTS.indexOf(t))).join("")
      : '<div class="empty"><b>No tests match.</b><br>Try a different search term or clear the filters.</div>';
  }

  function fillSelect(id, values){
    const sel = $(id);
    values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  }

  function init(data){
    DATA = data; TESTS = data.tests || [];
    $("hdr-lab").textContent = data.lab_city_display || "";
    $("hdr-city").textContent = data.city || "";
    $("hdr-date").textContent = "Updated " + (data.generated || "");
    $("st-tests").textContent = TESTS.length;
    $("st-inv").textContent = TESTS.reduce((n,t) => n + t.investigations.length, 0);
    $("foot").textContent = (data.org || "") + " — " + (data.title || "") + " · " + (data.lab_city_display || "") +
      " · Prices in INR · TAT in hours from sample receipt · Created by: George Cyriac ";

    fillSelect("f-sample", [...new Set(TESTS.map(t => t.sample).filter(Boolean))].sort());
    fillSelect("f-lab",    [...new Set(TESTS.map(t => t.lab).filter(Boolean))].sort());

    ["q","f-sample","f-lab","f-fast","f-nabl","sort"].forEach(id =>
      $(id).addEventListener(id === "q" ? "input" : "change", apply));
    $("reset").addEventListener("click", () => {
      $("q").value = ""; ["f-sample","f-lab","f-fast","f-nabl"].forEach(id => $(id).value = "");
      $("sort").value = "name"; expanded.clear(); allExpanded = false;
      $("expand-all").textContent = "Expand all"; apply();
    });
    $("expand-all").addEventListener("click", () => {
      allExpanded = !allExpanded; expanded.clear();
      $("expand-all").textContent = allExpanded ? "Collapse all" : "Expand all"; apply();
    });
    $("list").addEventListener("click", e => {
      const head = e.target.closest(".test-head"); if (!head) return;
      const card = head.parentElement, t = TESTS[+card.dataset.idx], key = t.id + "|" + t.name;
      if (card.classList.toggle("open")) expanded.add(key); else { expanded.delete(key); allExpanded = false; }
      head.setAttribute("aria-expanded", card.classList.contains("open"));
    });
    apply();
  }

  if (window.DOS_DATA) { init(window.DOS_DATA); }
  else {
    fetch("data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(init)
      .catch(() => {
        document.querySelector("main").innerHTML =
          '<div class="error-box"><b>Could not load data.json.</b><br>' +
          'Keep <code>data.json</code> (or <code>data.js</code>) in the same folder as <code>index.html</code>. ' +
          'If you opened this file directly from disk, your browser may block local file reads — ' +
          'either keep <code>data.js</code> alongside, or serve the folder (e.g. <code>python -m http.server</code>).</div>';
      });
  }
})();
</script>
<script data-hub-shared-state>(function(){
  var parts = location.pathname.split("/").filter(Boolean);
  if (!location.hostname.endsWith(".github.io") || parts.length < 2) return;
  var owner = location.hostname.split(".")[0];
  var repo = parts[0];
  var statePath = parts.slice(1).join("/").replace(/\.html?$/i, "") + ".state.json";
  var stateUrl = "/" + repo + "/" + statePath;
  var apiUrl = "https://api.github.com/repos/" + owner + "/" + repo + "/contents/" + statePath.split("/").map(encodeURIComponent).join("/");
  function els(){ return document.querySelectorAll("input, select, textarea"); }
  function idOf(el, i){ return el.id || el.name || "el" + i; }
  function apply(state){
    Array.prototype.forEach.call(els(), function(el, i){
      var k = idOf(el, i);
      if (!(k in state)) return;
      if (el.type === "checkbox" || el.type === "radio") el.checked = state[k];
      else el.value = state[k];
      el.dispatchEvent(new Event("input", {bubbles:true}));
      el.dispatchEvent(new Event("change", {bubbles:true}));
    });
  }
  function collect(){
    var s = {};
    Array.prototype.forEach.call(els(), function(el, i){
      var k = idOf(el, i);
      s[k] = (el.type === "checkbox" || el.type === "radio") ? el.checked : el.value;
    });
    return s;
  }
  function init(){
    fetch(stateUrl, {cache:"no-store"}).then(function(r){ if (r.ok) return r.json(); }).then(function(s){ if (s) apply(s); }).catch(function(){});
    var token = "";
    try { token = localStorage.getItem("hub-token") || ""; } catch(e){}
    if (!token) return;
    var btn = document.createElement("button");
    btn.textContent = "Save view for everyone";
    btn.style.cssText = "position:fixed;bottom:18px;right:18px;z-index:99999;background:#ff6d2e;color:#fff;border:0;border-radius:10px;padding:10px 14px;font:600 13px sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)";
    btn.onclick = function(){
      btn.textContent = "Saving...";
      var body = { message: "Update view state: " + statePath, content: btoa(unescape(encodeURIComponent(JSON.stringify(collect(), null, 2)))) };
      fetch(apiUrl, { headers: { "Authorization": "Bearer " + token }, cache: "no-store" })
        .then(function(g){ return g.ok ? g.json() : null; })
        .then(function(j){ if (j && j.sha) body.sha = j.sha;
          return fetch(apiUrl, { method: "PUT", headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }, body: JSON.stringify(body) });
        })
        .then(function(r){ btn.textContent = r && r.ok ? "Saved - live in ~1 min" : "Save failed"; })
        .catch(function(){ btn.textContent = "Save failed"; })
        .then(function(){ setTimeout(function(){ btn.textContent = "Save view for everyone"; }, 3500); });
    };
    document.body.appendChild(btn);
  }
  if (document.readyState === "loading") window.addEventListener("DOMContentLoaded", init); else init();
})();</script>
